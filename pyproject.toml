[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.1.0"
description = "LLM output quality evaluator: deterministic checks, a calibration-gated LLM judge, and meta-evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jeremy Bazan" }]
dependencies = [
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8.0"]
dev = ["pytest>=9.2.0", "coverage>=7.17.2"]

[project.scripts]
evalforge = "evalforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
