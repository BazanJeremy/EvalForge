name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run test suite (zero API keys by design)
        run: |
          coverage run -m pytest --junitxml=reports/junit.xml
          coverage xml
      - name: Gate - canonical scenarios must produce their declared exit codes
        run: |
          status=0
          {
            echo "## EvalForge canonical-scenario gate"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in data/samples/scenario_*; do
            name=$(basename "$dir")
            want=$(python -c "import json; print(json.load(open('$dir/manifest.json'))['expected_exit'])")
            got=0
            evalforge run --suite "$dir/suite.json" --outputs "$dir/outputs.jsonl" > /dev/null || got=$?
            line="$name: exit $got (expected $want)"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" -ne "$want" ]; then status=1; fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
